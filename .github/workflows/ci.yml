name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Frontmatter schema, structure, content hygiene, generated files
        run: uv run aiscientist-skill validate

  lint:
    name: Lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - name: Audit dependencies
        run: |
          uv export --locked --no-emit-project > requirements-audit.txt
          uvx pip-audit --strict --disable-pip -r requirements-audit.txt

  test:
    name: Test (Python ${{ matrix.python }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Registry tooling and per-skill tests
        run: uv run pytest

  install:
    # The tooling must work without uv: this is what pip, pipx and conda users get.
    name: Install with pip
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: aiscientist-skill --version
      - run: aiscientist-skill validate
      - run: aiscientist-skill list --json | python -c 'import json, sys; assert json.load(sys.stdin)'

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Tooling wheel and sdist
        run: uv build
      - name: Release assets (zips, catalog.json, SHA256SUMS)
        run: uv run aiscientist-skill package --out dist/release
      - name: Catalog site
        run: uv run aiscientist-skill site --out _site
      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: dist/release
          retention-days: 7

  permission-review:
    name: Permission review
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - id: review
        run: uv run aiscientist-skill review --base "origin/${{ github.base_ref }}"
      - name: Label for security review
        if: steps.review.outputs.needs_review == 'true'
        # Pull requests from forks get a read-only token; the job summary still shows the result.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.number }}" --add-label needs-security-review

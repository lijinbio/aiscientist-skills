name: Evals

# Trigger evals call the model, so they run on demand rather than on every push.
on:
  workflow_dispatch:
    inputs:
      case:
        description: Glob of eval case names (empty for all)
        required: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  trigger:
    name: Skill trigger evals
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: uv sync --locked
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASE: ${{ inputs.case }}
        run: uv run aiscientist-skill eval ${CASE:+--case "$CASE"} --json eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            eval-results.json
            evals/results/
          if-no-files-found: ignore

name: Catalog site

on:
  push:
    branches: [main]
    paths: ["skills/**", "catalog.json", "src/aiscientist_skills/site.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run aiscientist-skill site --out _site
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages (source: GitHub Actions) on first run instead of failing with 404.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
